<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
   "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>FIRMA-US01 - Vista Previa de la Firma</title>
    <style type="text/css">
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .camera-container {
            width: 100%;
            max-width: 700px;
            background-color: #0d0d0d;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title-text {
            color: #00e676;
            font-size: 1.5em;
            font-weight: bold;
            margin: 0;
        }

        .subtitle-text {
            color: #cccccc;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .viewfinder-box {
            width: 100%;
            height: 320px;
            border: 1.5px solid #00e676;
            border-radius: 8px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
        }

        .viewfinder-text {
            color: #888888;
            margin-top: 10px;
            font-size: 0.95em;
        }

        .info-note {
            color: #dddddd;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #222;
            padding-top: 15px;
        }

        .right-buttons {
            display: flex;
            gap: 10px;
        }

        /* Estilos de botones */
        .btn-disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
        }
    </style>
</h:head>

<h:body>

    <div class="camera-container">
        <h:form id="firmaForm">
            

            <div class="header-bar">

                <h:outputLink value="firmas.xhtml" title="Regresar">
                    <i class="pi pi-arrow-left" style="font-size: 1.5rem; color: #ffffff;"></i>
                </h:outputLink>

                <p:commandLink action="#{firmaController.cerrar}" title="Cerrar">
                    <i class="pi pi-times-circle" style="font-size: 1.5rem; color: #ff3333;"></i>
                </p:commandLink>
            </div>

            <h:outputText value="Foto destinado a la firma" styleClass="title-text" /><br/>
            <h:outputText value="Colócate dentro del encuadre y toma la foto cuando estés listo." styleClass="subtitle-text" />

            <div class="viewfinder-box">
                <i class="pi pi-camera" style="font-size: 2.5rem; color: #888888;"></i>
                <span class="viewfinder-text">Vista previa de la cámara</span>
            </div>

            <div class="info-note">
                <i class="pi pi-info-circle"></i>
                <h:outputText value="Nota: Busca un lugar bien iluminado y mira hacia la cámara." />
            </div>

             <div class="action-bar">
                

                <p:commandButton id="btnTomarFoto"
                                 value="Tomar foto" 
                                 icon="pi pi-camera" 
                                 action="#{firmaController.tomarFoto}" 
                                 disabled="true"
                                 styleClass="btn-disabled"
                                 style="background-color: #008000; border-color: #00e676; color: #ffffff;" />

                <div class="right-buttons">
                    <p:commandButton id="btnDescartar"
                                     value="Descartar" 
                                     action="#{firmaController.descartarFoto}" 
                                     update="@form"
                                     style="background-color: #ffffff; color: #000000; border: 2px solid #ff0000; font-weight: bold;" />

                    <p:commandButton id="btnAceptar"
                                     value="Aceptar" 
                                     icon="pi pi-check" 
                                     action="#{firmaController.aceptarFoto}" 
                                     style="background-color: #ffffff; color: #000000; border: 2px solid #00e676; font-weight: bold;" />
                </div>
            </div>

        </h:form>
    </div>

</h:body>
</html>
